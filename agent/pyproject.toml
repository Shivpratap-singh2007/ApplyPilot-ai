[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "applypilot-agent"
version = "0.1.0"
description = "ApplyPilot AI local LLM (Ollama) and Playwright form automation engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "playwright>=1.49.0",
]

