[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "applypilot-backend"
version = "0.1.0"
description = "ApplyPilot AI FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

